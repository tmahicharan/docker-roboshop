services:
  catalogue:
    build: 
      context: ./catalogue
    image: mahicharan/catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb
  mongodb:
    build: 
      context: ./mongodb
    image: mahicharan/mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db
  redis:
    image: redis:7.0
    container_name: redis
    volumes:
      - redis:/data
  mysql:
    build: 
      context: ./mysql
    image: mahicharan/mysql:v1
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
      - rabbitmq:/var/lib/rabbitmq
  user:
    build: 
      context: ./user
    image: mahicharan/user:v1
    container_name: user
    depends_on:
      - mongodb
      - redis
  cart:
    build: 
      context: ./cart
    image: mahicharan/cart:v1
    container_name: cart
    depends_on:
      - redis
      - catalogue
  shipping:
    build: 
      context: ./shipping
    image: mahicharan/shipping:v1
    container_name: shipping
    depends_on:
      - mysql
      - cart
  payment:
    build: 
      context: ./payment
    image: mahicharan/payment:v1
    container_name: payment
    depends_on:
      - rabbitmq
      - cart
      - user
  frontend:
    build: 
      context: ./frontend
    image: mahicharan/frontend:v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
networks:
  default:
    driver: bridge
    name: roboshop
    external: false
volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq: